name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types:
    - opened
    - reopened
    - synchronize
    - ready_for_review

env:
  CARGO_BACKTRACE: full
  RUSTFLAGS: "--deny warnings"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.72.1
        with:
          components: clippy, rustfmt

      - run: cargo check
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-features

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.72.1
      - run: cargo test

  security_audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.72.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
